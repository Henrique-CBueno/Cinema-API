spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: hello-api
              uri: lb://hello
              predicates:
                - Path=/hello/**
              filters:
                - TokenRelay= # Repassa o token para o serviço de destino

            - id: catalog-api
              uri: lb://catalog
              predicates:
                - Path=/catalog/**
              filters:
                - TokenRelay=


  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: gateway
            client-secret: STxwVph40H8nyoINGW4lvAiWP8LK3YUf
            scope: openid, profile, email
        provider:
          keycloak:
            issuer-uri: http://localhost:9090/realms/auth
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/auth

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 8080