spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: hello-api
              uri: lb://hello
              predicates:
                - Path=/hello/**
              filters:
                - TokenRelay= # Repassa o token para o serviço de destino

            - id: catalog-api
              uri: lb://catalog
              predicates:
                - Path=/catalog/**
              filters:
                - TokenRelay=

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: gateway
            client-secret: p0Ae5i2OIdns4KP9yWWoKznDzOXAwpJH
            scope: openid, profile, email
        provider:
          keycloak:
            issuer-uri: http://localhost:9090/realms/auth
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/auth

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  swagger-ui:
    urls:
      - name: catalog-service
        url: /catalog/v3/api-docs
  api-docs:
    path: /v3/api-docs

server:
  port: 8080
