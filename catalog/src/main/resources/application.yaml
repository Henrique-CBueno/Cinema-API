spring:
  application:
    name: catalog
  datasource:
    url: jdbc:postgresql://localhost:5432/catalog_db
    username: cinema
    password: cinema
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    # Garante que o script rode DEPOIS que o Hibernate criar as tabelas
    defer-datasource-initialization: true
  # Força a execução do script sempre
  sql:
    init:
      mode: always

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
server:
  port: 0
  servlet:
    context-path: /catalog
