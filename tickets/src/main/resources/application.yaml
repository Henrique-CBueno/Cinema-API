spring:
  application:
    name: tickets
  data:
    mongodb:
      auto-index-creation: true
  cloud:
    aws:
          s3:
            bucket: cinema-tickets-bucket
          region:
            static: us-east-1
          credentials:
            access-key: test
            secret-key: test
          endpoint: http://localhost:4566
  mongodb:
    uri: mongodb://localhost:27017/tickets_db

sqs:
  queue:
    reservation_paid: reservation_paid

server:
  port: 0

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

ticket:
  jwt-secret: minha-chave-super-secreta-123456
  jwt-expiration: 86400

